name: MAIN.EXE
sha1: f41c4065788e8c838cbd8b22f0fff6d4bc7de49a
options:
  basename: main
  target_path: disc/MAIN.EXE
  base_path: ..
  platform: psx
  compiler: PSYQ
  asm_path: asm/main
  src_path: src/main
  asset_path: assets/main
  build_path: build
  ld_script_path: build/main.ld
  find_file_boundaries: False
  gp_value: 0x800BE0D4
  o_as_suffix: True
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  symbol_addrs_path:
    - config/symbols/main.txt
  undefined_funcs_auto_path: build/main.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/main.undefined_syms_auto.txt
  subalign: 2
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: header
    type: header
    start: 0x0
  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    subsegments:
      - [0x800, rodata]
      - [0xD2C0, asm]
      - [0x8D890, data]
  - [0xAF000]
