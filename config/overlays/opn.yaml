name: OPN.BIN
sha1: 0462c26910a5285eb231cf0d95499f034ae136f4
options:
  basename: opn
  target_path: disc/BIN/OPN.BIN
  base_path: ../..
  platform: psx
  compiler: PSYQ
  asm_path: asm/opn
  src_path: src/opn
  asset_path: assets/opn
  build_path: build
  ld_script_path: build/opn.ld
  find_file_boundaries: False
  gp_value: 0x800BE0D4
  o_as_suffix: True
  use_legacy_include_asm: False
  section_order: [".rodata", ".text", ".data", ".bss"]
  symbol_addrs_path:
    - config/symbols/main.txt
    - config/symbols/opn.txt
  undefined_funcs_auto_path: build/opn.undefined_funcs_auto.txt
  undefined_syms_auto_path: build/opn.undefined_syms_auto.txt
  subalign: 2
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: opn
    type: code
    start: 0x0
    vram: 0x8018A000
    subsegments:
      - [0x0, data]
      - [0x2DC, asm]
      - [0x3378, data]
  - [0x351C]
